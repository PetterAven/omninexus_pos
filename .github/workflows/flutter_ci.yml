name: Flutter CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test_and_analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Install Linux System Dependencies (for SQLite / Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Create Dummy .env File for CI
        run: |
          touch .env
          echo "SUPABASE_URL=https://dummy.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=sb_publishable_dummy_key" >> .env
          echo "TELEGRAM_BOT_TOKEN=dummy_token" >> .env
          echo "TELEGRAM_CHAT_ID=dummy_chat_id" >> .env

      - name: 🔍 Analyze Code
        run: flutter analyze

      - name: 🧪 Run Dynamic Unit & Integration Tests
        run: flutter test --coverage

      - name: 📊 Upload Coverage Report
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info