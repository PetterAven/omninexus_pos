name: omninexus_pos
description: "Sistema Punto de Venta OmniNexus para Windows"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Motor de base de datos nativo para Escritorio (FFI)
  sqflite_common_ffi: ^2.4.2
  excel: ^4.0.6
  path: ^1.9.1
  supabase_flutter: ^2.16.0
  pdf: ^3.12.0
  http: ^1.6.0
  path_provider: ^2.1.6
  printing: ^5.14.3
  mobile_scanner: ^7.4.0
  sqflite: ^2.4.3
  # NUEVO: para leer las credenciales de Supabase desde un archivo .env
  # en vez de tenerlas escritas directamente en el código fuente.
  flutter_dotenv: ^5.2.1
  # NUEVO: para hashear contraseñas de usuarios (antes se guardaban en
  # texto plano en la tabla `users`, tanto local como en Supabase).
  bcrypt: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Configuración del generador de iconos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - .env