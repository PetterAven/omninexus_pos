name: omninexus_pos
description: "Sistema Punto de Venta OmniNexus Multiplataforma"
publish_to: 'none'
# Incrementar la versión para el nuevo compilado: 1.0.1 (versión usuario) + 2 (código interno)
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado Global & Reactividad (Riverpod)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Base de datos, backend y utilidades
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  sqlite3_flutter_libs: ^0.5.24 # 👈 AGREGADO: empaqueta sqlite3.dll para Windows Release
  supabase_flutter: ^2.16.0
  bcrypt: ^1.1.3
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.2.2

  # Generación de reportes, tickets e impresión
  excel: ^4.0.6
  pdf: ^3.12.0
  printing: ^5.14.3
  
  # Red, archivos y escáner
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.0

  # Importación/exportación masiva de inventario
  file_picker: ^11.0.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

  # Generadores de código para Riverpod
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.0

# Configuración del generador de iconos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - .env